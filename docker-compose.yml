services:
  backend:
    build:
      context: ./backendAPI/simpleapi
    networks:
      - app-network
      - sec-network
    depends_on:
      - database

  database:
    build:
      context: ./database
    networks:
      - app-network
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: db
      POSTGRES_USER: usr
      POSTGRES_PASSWORD: pwd

  httpd:
    build:
      context: ./HTTPserver
    ports:
      - "80:80"
    networks:
      - sec-network
    depends_on:
      - backend

networks:
  app-network:
  sec-network:

volumes:
  db-data: